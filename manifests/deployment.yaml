apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-lab
  template:
    metadata:
      labels:
        app: harness-lab
    spec:
      containers:
        - name: harness-lab
          image: bswork26/harness-lab:latest
          ports:
            - containerPort: 8080
